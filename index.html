<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreams of a World</title>
<meta name="description" content="Dreams of a World — essays by Symon Petlura on technology, progress, and the futures we could build.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#03050b;--cream:#ece6d8;--gold:#d9b46c;--cyan:#8fe3ff;--muted:#958f83;--display:'Michroma',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
::selection{background:var(--gold);color:var(--ink)}

#gl,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#gl{z-index:0;background:radial-gradient(ellipse at 70% 110%,#10203a 0%,#03050b 60%)}
#fx{z-index:1;pointer-events:none}

header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:20px 28px;transition:background .4s}
header.solid{background:rgba(3,5,11,.82);backdrop-filter:blur(8px)}
.mark{font-family:var(--display);font-size:11px;letter-spacing:.32em;color:#f3eee4;display:flex;align-items:center;gap:12px}
.mark i{width:9px;height:9px;border:1px solid var(--cyan);border-radius:50%;box-shadow:0 0 10px rgba(143,227,255,.6);position:relative}
.mark i::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--cyan)}
header nav a{font-family:'Josefin Sans',sans-serif;font-size:10.5px;letter-spacing:.36em;text-transform:uppercase;color:var(--gold);transition:color .3s}
header nav a:hover{color:var(--cream)}

/* hero */
.hero{position:relative;z-index:2;height:100vh;display:flex;align-items:center;padding:0 8vw}
.hero-in{max-width:880px;margin-top:-6vh}
.eyebrow{font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:.5em;text-transform:uppercase;color:var(--gold);opacity:0;transition:opacity 1.6s ease 1.2s;text-shadow:0 0 14px #000}
.loaded .eyebrow{opacity:1}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6.6vw,104px);line-height:1.12;letter-spacing:.06em;color:#f6f2ea;margin:26px 0 26px;text-shadow:0 0 40px rgba(143,227,255,.18),0 0 80px rgba(0,0,0,.8)}
h1 .ln{display:block;white-space:nowrap}
h1 .ch{display:inline-block;opacity:0;filter:blur(14px);transform:scale(1.35);transition:opacity 1.1s ease,filter 1.1s ease,transform 1.4s cubic-bezier(.2,.7,.2,1)}
h1 .ch.in{opacity:1;filter:blur(0);transform:none}
.tag{max-width:520px;font-style:italic;font-size:clamp(19px,2vw,24px);line-height:1.5;color:#ddd6c6;opacity:0;transform:translateY(10px);transition:opacity 1.6s ease 4.2s,transform 1.6s ease 4.2s;text-shadow:0 0 16px #000}
.loaded .tag{opacity:1;transform:none}
.enter{display:inline-flex;align-items:center;gap:14px;margin-top:38px;font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#f3eee4;padding:15px 22px 15px 26px;border:1px solid rgba(143,227,255,.45);background:rgba(3,6,14,.35);backdrop-filter:blur(4px);opacity:0;transition:opacity 1.6s ease 5s,border-color .3s,box-shadow .3s}
.loaded .enter{opacity:1}
.enter:hover{border-color:var(--cyan);box-shadow:0 0 36px rgba(143,227,255,.22)}
.enter b{font-weight:400;color:var(--cyan);transition:transform .3s}.enter:hover b{transform:translateY(3px)}
.hud{position:absolute;right:28px;bottom:26px;font-family:'Josefin Sans',sans-serif;font-size:9.5px;letter-spacing:.36em;text-transform:uppercase;color:rgba(236,230,216,.55);text-align:right;line-height:2;opacity:0;transition:opacity 2s ease 6s}
.loaded .hud{opacity:1}
.hud span{color:var(--cyan)}

/* transmissions */
#transmissions{position:relative;z-index:2;padding:130px 16px 120px;background:linear-gradient(180deg,rgba(3,5,11,0) 0%,rgba(3,5,11,.86) 140px,rgba(3,5,11,.93) 100%)}
.sec{max-width:1120px;margin:0 auto}
.sec-head{display:flex;align-items:baseline;gap:22px;margin-bottom:46px}
.sec-head h2{font-family:var(--display);font-weight:400;font-size:clamp(18px,2.2vw,26px);letter-spacing:.2em;color:#f3eee4}
.sec-head .line{flex:1;height:1px;background:linear-gradient(90deg,rgba(143,227,255,.6),rgba(217,180,108,.3),transparent)}
.sec-head .count{font-family:'Josefin Sans',sans-serif;font-size:10.5px;letter-spacing:.36em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:30px}
.card{position:relative;display:flex;flex-direction:column;border:1px solid rgba(143,227,255,.16);background:rgba(6,10,22,.72);overflow:hidden;transition:border-color .4s,box-shadow .4s,transform .4s}
.card:hover{border-color:rgba(143,227,255,.55);box-shadow:0 30px 80px -30px rgba(143,227,255,.3);transform:translateY(-3px)}
.card::before,.card::after{content:"";position:absolute;width:16px;height:16px;border-color:var(--cyan);border-style:solid;z-index:2;opacity:.7;transition:all .4s}
.card::before{top:10px;left:10px;border-width:1px 0 0 1px}
.card::after{bottom:10px;right:10px;border-width:0 1px 1px 0}
.card:hover::before{top:6px;left:6px;opacity:1}.card:hover::after{bottom:6px;right:6px;opacity:1}
.cover{position:relative;aspect-ratio:16/9;overflow:hidden;background:linear-gradient(135deg,#0d1b33,#1a1030 60%,#05070e)}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02);transition:transform 1.4s cubic-bezier(.2,.7,.2,1),filter .6s;filter:saturate(.95) brightness(.92)}
.card:hover .cover img{transform:scale(1.07);filter:saturate(1.05) brightness(1)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(6,10,22,.92))}
.card .body{padding:26px 30px 30px;display:flex;flex-direction:column;gap:12px;flex:1}
.card .row{display:flex;gap:14px;align-items:center;font-family:'Josefin Sans',sans-serif;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.card .row{flex-wrap:wrap;row-gap:6px}.card .row span{white-space:nowrap}
.card .num{font-family:var(--display);font-size:10px;letter-spacing:.2em;color:var(--cyan)}
.card h3{font-family:var(--display);font-weight:400;font-size:clamp(18px,1.9vw,24px);line-height:1.35;letter-spacing:.03em;color:#f6f2ea}
.card p{font-size:19px;line-height:1.5;color:#c9c2b2;font-style:italic}
.card .read{margin-top:auto;padding-top:10px;font-family:'Josefin Sans',sans-serif;font-size:10.5px;letter-spacing:.36em;text-transform:uppercase;color:var(--gold)}
.card .read b{font-weight:400;display:inline-block;transition:transform .3s}.card:hover .read b{transform:translateX(6px)}
.card.featured{grid-column:1/-1;flex-direction:row}
.card.featured .cover{flex:1.35;aspect-ratio:auto;min-height:380px}
.card.featured .cover::after{background:linear-gradient(90deg,transparent 55%,rgba(6,10,22,.95))}
.card.featured .body{flex:1;justify-content:center;padding:44px 46px}
.card.featured h3{font-size:clamp(22px,2.6vw,34px)}
.card.featured p{font-size:21px}
@media(max-width:860px){.grid{grid-template-columns:1fr}.card.featured{flex-direction:column}.card.featured .cover{min-height:0;aspect-ratio:16/9}.card.featured .cover::after{background:linear-gradient(180deg,transparent 45%,rgba(6,10,22,.92))}.card.featured .body{padding:26px 28px 30px}}
footer{position:relative;z-index:2;padding:60px 16px 70px;text-align:center;background:rgba(3,5,11,.95);font-family:'Josefin Sans',sans-serif;font-size:10.5px;letter-spacing:.36em;text-transform:uppercase;color:var(--muted)}
footer .m{font-family:var(--display);color:#f3eee4;letter-spacing:.3em;margin-bottom:14px;font-size:12px}
.reveal{opacity:0;transform:translateY(28px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
@media(max-width:600px){header{padding:16px}.mark{font-size:9.5px;letter-spacing:.24em}.hero{padding:0 22px;align-items:flex-start;padding-top:22vh}.hud{display:none}}
@media (prefers-reduced-motion: reduce){h1 .ch{transition:none}.reveal{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<header id="hdr">
  <a class="mark" href="./"><i></i>DREAMS OF A WORLD</a>
  <nav><a href="#transmissions">Transmissions</a></nav>
</header>

<section class="hero">
  <div class="hero-in">
    <div class="eyebrow">Essays by Symon Petlura</div>
    <h1 aria-label="Dreams of a World"><span class="ln" data-t="DREAMS OF"></span><span class="ln" data-t="A WORLD"></span></h1>
    <p class="tag">On technology, progress, and the futures we could build.</p>
    <a class="enter" href="#transmissions">Read the transmissions <b>↓</b></a>
  </div>
  <div class="hud">Orbit · <span>Night side</span><br>Local dawn in progress</div>
</section>

<section id="transmissions">
  <div class="sec">
    <div class="sec-head reveal"><h2>TRANSMISSIONS</h2><div class="line"></div><div class="count" id="count"></div></div>
    <div class="grid" id="list"></div>
  </div>
</section>

<footer>
  <div class="m">DREAMS OF A WORLD</div>
  © <span id="yr">2026</span> Symon Petlura
</footer>

<!-- =====================================================================
     ARTICLE LIST — the homepage builds its cards from this.
     To add an article: add one entry. Newest is shown first automatically.
     ===================================================================== -->
<script id="articles-data" type="application/json">
[
  {
    "slug": "a-future-worth-building",
    "title": "A Future Worth Building",
    "dek": "On Marc Andreessen’s Techno-Optimist Manifesto, and a case for reading it in good faith.",
    "date": "2026-11-09",
    "readTime": "3 min read",
    "cover": "a-future-worth-building/cover.jpg"
  }
]
</script>

<script>
(()=>{
const $=s=>document.querySelector(s);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const smooth=t=>t*t*(3-2*t);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- article cards ---------------- */
const data=JSON.parse($('#articles-data').textContent);
const chrono=[...data].sort((a,b)=>a.date.localeCompare(b.date));
const nums=new Map(chrono.map((a,i)=>[a.slug,String(i+1).padStart(3,'0')]));
const list=[...data].sort((a,b)=>b.date.localeCompare(a.date));
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#list').innerHTML=list.map((a,i)=>`
  <a class="card reveal${i===0?' featured':''}" href="${esc(a.slug)}/">
    <div class="cover">${a.cover?`<img src="${esc(a.cover)}" alt="" loading="lazy" onerror="this.remove()">`:''}</div>
    <div class="body">
      <div class="row"><span class="num">NO. ${nums.get(a.slug)}</span><span>${fmt(a.date)}</span><span>${esc(a.readTime||'')}</span></div>
      <h3>${esc(a.title)}</h3>
      <p>${esc(a.dek||'')}</p>
      <div class="read">Read the essay <b>→</b></div>
    </div>
  </a>`).join('');
$('#count').textContent=data.length+(data.length===1?' essay':' essays');
$('#yr').textContent=new Date().getFullYear();
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{rootMargin:'0px 0px -8% 0px'});
document.querySelectorAll('.reveal').forEach(e=>io.observe(e));
addEventListener('scroll',()=>$('#hdr').classList.toggle('solid',scrollY>innerHeight*.6),{passive:true});

/* ---------------- title letters ---------------- */
const chars=[];
document.querySelectorAll('h1 .ln').forEach(l=>{for(const c of l.dataset.t){const s=document.createElement('span');s.className='ch';s.textContent=c===' '?' ':c;l.appendChild(s);chars.push(s);}});
setTimeout(()=>{document.body.classList.add('loaded');chars.forEach(c=>setTimeout(()=>c.classList.add('in'),reduced?0:1800+Math.random()*1800));},60);

/* ---------------- GPU scene: planet from orbit at dawn ---------------- */
const VS=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const FS=`
precision highp float;
uniform vec2 uRes;uniform float uTime;uniform vec3 uCam,uRight,uUp,uFwd,uSun;uniform vec2 uSunUV;uniform float uFlare,uFov;uniform mat3 uRot;
const float RA=1.024;
const float HR=0.00176;          // Rayleigh scale height (8 km, slightly exaggerated) in planet radii
const float HM=0.00028;          // Mie scale height
const vec3 KR=vec3(35.0,82.8,142.7)*1.0;   // Rayleigh coefficients per planet radius
const float KM=95.0;
vec2 rsi(vec3 ro,vec3 rd,float r){float b=dot(ro,rd),c=dot(ro,ro)-r*r,d=b*b-c;if(d<0.)return vec2(1e5,-1e5);d=sqrt(d);return vec2(-b-d,-b+d);}
float hash(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
  return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
const mat3 M3=mat3(0.00,0.80,0.60,-0.80,0.36,-0.48,-0.60,-0.48,0.64);
float fbm(vec3 p,int o){float a=.5,t=0.,n=0.;for(int i=0;i<7;i++){if(i>=o)break;t+=a*noise(p);n+=a;p=M3*p*2.02;a*=.5;}return t/n;}

vec3 atmo(vec3 ro,vec3 rd,float tMax,out vec3 tr){
  tr=vec3(1.);vec2 ta=rsi(ro,rd,RA);if(ta.x>ta.y)return vec3(0.);
  float t0=max(ta.x,0.),t1=min(ta.y,tMax);if(t1<=t0)return vec3(0.);
  float dt=(t1-t0)/12.,mu=dot(rd,uSun),g=.76,gg=g*g;
  float pR=.0597*(1.+mu*mu),pM=.1194*((1.-gg)*(1.+mu*mu))/(pow(1.+gg-2.*mu*g,1.5)*(2.+gg));
  float oR=0.,oM=0.;vec3 sR=vec3(0.),sM=vec3(0.);float t=t0+dt*.5;
  for(int i=0;i<12;i++){
    vec3 p=ro+rd*t;float h=max(length(p)-1.,0.);float dR=exp(-h/HR)*dt,dM=exp(-h/HM)*dt;oR+=dR;oM+=dM;
    vec2 sp=rsi(p,uSun,1.);
    float lit=(sp.x>0.&&sp.x<sp.y)?0.:1.;
    if(lit>0.){float l=rsi(p,uSun,RA).y,ds=l/5.,jR=0.,jM=0.,s=ds*.5;
      for(int j=0;j<5;j++){vec3 q=p+uSun*s;float hq=max(length(q)-1.,0.);jR+=exp(-hq/HR)*ds;jM+=exp(-hq/HM)*ds;s+=ds;}
      vec3 at=exp(-(KM*(oM+jM)+KR*(oR+jR)));sR+=dR*at;sM+=dM*at;}
    t+=dt;}
  tr=exp(-(KR*oR+KM*oM));
  return 22.*(pR*KR*sR+pM*KM*sM);
}
vec3 surface(vec3 n,vec3 rd){
  vec3 q=uRot*n;
  float h=fbm(q*2.1+vec3(3.1,1.7,.2),7);
  float land=smoothstep(.515,.53,h);
  float lat=abs(q.y);
  float dry=fbm(q*4.3+9.,4);
  vec3 ocean=mix(vec3(.003,.012,.035),vec3(.008,.04,.075),smoothstep(.42,.515,h));
  vec3 ground=mix(vec3(.035,.05,.022),vec3(.13,.10,.06),smoothstep(.45,.65,dry));
  ground=mix(ground,vec3(.09,.08,.07),smoothstep(.6,.72,h));
  float ice=smoothstep(.8,.9,lat+(h-.5)*.4);
  vec3 alb=mix(ocean,ground,land);alb=mix(alb,vec3(.55,.6,.66),ice);
  vec3 cq=q*2.6+vec3(uTime*.0025,0.,0.);
  float c=fbm(cq+fbm(cq*1.7,3)*.9,6);c=smoothstep(.48,.72,c);
  float nl=dot(n,uSun);
  vec3 sunT=exp(-(KR*HR+KM*HM)*1.4/max(nl+.06,.025));
  float diff=max(nl,0.);
  vec3 L=sunT*diff*2.6;
  vec3 col=alb*L;
  vec3 hv=normalize(uSun-rd);
  col+=vec3(1.,.9,.75)*pow(max(dot(n,hv),0.),160.)*(1.-land)*(1.-c)*sunT*diff*6.;
  col=mix(col,vec3(.85,.87,.9)*L,c*.95);
  float night=smoothstep(.04,-.2,nl);
  float region=smoothstep(.5,.7,fbm(q*9.+4.,4));
  float coast=exp(-abs(h-.525)*70.)*land;
  float dens=clamp(region*.8+coast*.9,0.,1.)*land*(1.-ice);
  float grain=noise(q*190.)*noise(q*410.+7.);
  float pts=smoothstep(.18,.55,grain);
  float glow=dens*dens*.22;
  float city=dens*pts*1.6+glow;
  col+=vec3(1.,.62,.28)*city*night*(1.-c*.8)*.9;
  return col;
}
vec3 stars(vec3 rd){
  vec3 col=vec3(0.);
  vec3 bn=normalize(vec3(.25,1.,.35));float band=exp(-pow(dot(rd,bn),2.)*9.);
  for(int i=0;i<2;i++){float sc=i==0?150.:340.;vec3 g=rd*sc,id=floor(g),f=fract(g)-.5;float h=hash(id+float(i)*17.);
    float th=i==0?.985:.955-band*.06;
    if(h>th){vec3 o=vec3(hash(id+1.3),hash(id+2.7),hash(id+5.1))-.5;float d=length(f-o*.7);
      float b=pow(hash(id+7.7),4.)*(i==0?4.:1.6)+.15;vec3 sc2=mix(vec3(.7,.8,1.),vec3(1.,.85,.7),hash(id+9.1));
      col+=sc2*b*exp(-d*d*(i==0?90.:160.))*(.8+.2*sin(uTime*2.+h*90.));}}
  float n=fbm(rd*3.2+2.,5),n2=fbm(rd*6.+7.,4);
  vec3 neb=mix(vec3(.22,.1,.32),vec3(.05,.2,.3),n2)*smoothstep(.42,.8,n)*band*.5;
  neb*=1.-.75*smoothstep(.5,.72,fbm(rd*9.+1.,4))*band;
  return col+neb+vec3(.004,.006,.012);
}
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;
  vec3 rd=normalize(uFwd+uv.x*uFov*uRight+uv.y*uFov*uUp);
  vec3 ro=uCam;
  vec2 tp=rsi(ro,rd,1.);bool hit=tp.x>0.&&tp.x<tp.y;
  vec3 tr;vec3 sky=atmo(ro,rd,hit?tp.x:1e9,tr);
  vec3 col;
  if(hit){col=surface(normalize(ro+rd*tp.x),rd)*tr;}
  else{
    float sd=max(dot(rd,uSun),0.);
    vec3 sun=vec3(1.,.93,.82)*(smoothstep(.99994,.99997,sd)*60.+pow(sd,3000.)*8.+pow(sd,180.)*.9+pow(sd,14.)*.07);
    col=(stars(rd)+sun)*tr;
  }
  col+=sky;
  // lens: anamorphic streak + ghosts
  vec2 sv=uSunUV;vec3 fl=vec3(0.);
  fl+=vec3(.3,.55,1.)*exp(-abs(uv.y-sv.y)*260.)*exp(-abs(uv.x-sv.x)*2.4)*.75;
  fl+=vec3(1.,.85,.6)*exp(-length(uv-sv)*9.)*.35;
  for(int i=0;i<5;i++){float k=.35+float(i)*.32;vec2 gp=sv-sv*k*2.;float r=.018+.035*float(i);
    float gh=smoothstep(r,r*.55,length(uv-gp))*.05;fl+=gh*mix(vec3(.3,.6,1.),vec3(1.,.55,.3),fract(k*1.7));}
  col+=fl*uFlare;
  col=aces(col*1.15);
  col=pow(col,vec3(.92));
  float v=smoothstep(1.25,.35,length(uv*vec2(.9,1.15)));col*=mix(.45,1.,v);
  col+=(hash(vec3(gl_FragCoord.xy,uTime*60.))-.5)*.025;
  gl_FragColor=vec4(col,1.);
}`;

const cv=$('#gl');
const gl=cv.getContext('webgl',{antialias:false,alpha:false,powerPreference:'high-performance'});
let prog,U={},scale=.7,W=0,H=0;
function compile(t,s){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));return sh;}
if(gl){
  try{
    prog=gl.createProgram();gl.attachShader(prog,compile(gl.VERTEX_SHADER,VS));gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    ['uRes','uTime','uCam','uRight','uUp','uFwd','uSun','uSunUV','uFlare','uFov','uRot'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
  }catch(e){console.warn('Scene shader unavailable:',e);prog=null;}
}
function size(){
  W=innerWidth;H=innerHeight;if(W<40||H<40)return false;
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.max(2,Math.round(W*dpr*scale));cv.height=Math.max(2,Math.round(H*dpr*scale));
  fx.width=Math.round(W*Math.min(dpr,1.5));fx.height=Math.round(H*Math.min(dpr,1.5));
  return true;
}

/* vector helpers */
const v3={add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  norm:a=>{const l=Math.hypot(a[0],a[1],a[2]);return [a[0]/l,a[1]/l,a[2]/l];}};

/* camera choreography: a slow push-in while the sun rises over the limb */
const FOV=.82;
function camera(t,sc){
  const intro=reduced?1:smooth(clamp(t/14));
  const dist=2.75-intro*.47+sc*.2;
  const az=-.35+.05*Math.sin(t*.018), el=.16+.03*Math.sin(t*.013+1);
  const cam=[Math.sin(az)*Math.cos(el)*dist,Math.sin(el)*dist,Math.cos(az)*Math.cos(el)*dist];
  const f0=v3.norm(v3.mul(cam,-1));
  let r0=v3.norm(v3.cross(f0,[0,1,0])),u0=v3.cross(r0,f0);
  const fwd=v3.norm(v3.add(f0,v3.add(v3.mul(u0,.5-sc*.08),v3.mul(r0,-.36))));
  const right=v3.norm(v3.cross(fwd,[0,1,0])),up=v3.cross(right,fwd);
  // sun sits just beyond the planet's upper-left limb and climbs over it
  const ang=Math.asin(1/dist);
  const w=v3.norm(v3.add(v3.mul(u0,.72),v3.mul(r0,-.69)));
  const delta=(reduced?.014:-.05+.066*smooth(clamp((t-1)/10)))+.004*Math.sin(t*.05);
  const a=ang+delta;
  const sun=v3.norm(v3.add(v3.mul(f0,Math.cos(a)),v3.mul(w,Math.sin(a))));
  // sun position on screen + how much of it clears the limb
  const z=v3.dot(sun,fwd);
  const su=[v3.dot(sun,right)/z/FOV,v3.dot(sun,up)/z/FOV];
  const tc=-v3.dot(cam,sun);let vis=1;
  if(tc>0){const cl=v3.add(cam,v3.mul(sun,tc));vis=smooth(clamp((Math.hypot(...cl)-1.006)/.03));}
  return {cam,right,up,fwd,sun,su,vis:vis*(z>0?1:0)};
}
function rotMat(t){const a=t*.006+2.2,c=Math.cos(a),s=Math.sin(a),ti=.41,ct=Math.cos(ti),st=Math.sin(ti);
  // spin about a tilted axis (column-major for GLSL)
  return new Float32Array([c,s*st,s*ct, 0,ct,-st, -s,c*st,c*ct]);}

/* ---------------- starships (2D overlay, lit to match the scene) ---------------- */
const fx=$('#fx'),fctx=fx.getContext('2d');
function sprite(c){const s=document.createElement('canvas');s.width=s.height=128;const g=s.getContext('2d'),r=g.createRadialGradient(64,64,0,64,64,64);
  r.addColorStop(0,`rgba(${c},1)`);r.addColorStop(.15,`rgba(${c},.55)`);r.addColorStop(.45,`rgba(${c},.12)`);r.addColorStop(1,`rgba(${c},0)`);g.fillStyle=r;g.fillRect(0,0,128,128);return s;}
const ENG=sprite('140,210,255'),WHT=sprite('255,250,240');
const HULL={
  capital:[[.5,0],[.38,-.03],[.16,-.05],[.08,-.085],[-.06,-.09],[-.1,-.06],[-.3,-.065],[-.36,-.1],[-.5,-.1],[-.52,-.04],[-.52,.05],[-.36,.075],[-.1,.06],[.16,.045],[.38,.025]],
  escort:[[.5,0],[.18,-.06],[-.22,-.09],[-.4,-.06],[-.5,-.07],[-.52,-.02],[-.52,.03],[-.4,.05],[-.22,.075],[.18,.05]],
};
const FLEET=[{type:'capital',ox:0,oy:0,s:1},{type:'escort',ox:-.55,oy:-.32,s:.42},{type:'escort',ox:-.6,oy:.34,s:.4},{type:'escort',ox:-1.1,oy:-.08,s:.36},{type:'escort',ox:.35,oy:-.5,s:.33}];
function drawShip(g,type,L,lit){
  const pts=HULL[type];
  g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x*L,y*L):g.moveTo(x*L,y*L));g.closePath();
  const hg=g.createLinearGradient(0,-.1*L,0,.08*L);hg.addColorStop(0,`rgb(${70+60*lit|0},${78+56*lit|0},${96+44*lit|0})`);hg.addColorStop(.25,'#1c2230');hg.addColorStop(.7,'#0a0d15');hg.addColorStop(1,'#04060a');
  g.fillStyle=hg;g.fill();
  g.strokeStyle=`rgba(255,214,170,${.25+.5*lit})`;g.lineWidth=Math.max(.6,L*.006);g.beginPath();
  pts.filter(p=>p[1]<=0).forEach(([x,y],i)=>i?g.lineTo(x*L,y*L):g.moveTo(x*L,y*L));g.stroke();
  if(L>40){g.fillStyle='rgba(255,215,160,.8)';for(let i=0;i<14;i++){const x=(-.3+i*.045)*L;g.fillRect(x,-.02*L,Math.max(.7,L*.006),Math.max(.6,L*.004));}}
}
function drawFleet(t){
  const g=fctx,k=fx.width/W;g.setTransform(k,0,0,k,0,0);g.clearRect(0,0,W,H);
  if(reduced)return;
  const CYC=46,T0=6;
  for(let wave=0;wave<2;wave++){
    const lt=t-T0-wave*CYC/2;if(lt<0)continue;
    const u=(lt%CYC)/CYC;
    const persp=(1/(1+11*u)-1/12)/(1-1/12);                     // 1 near the camera -> 0 at the planet
    const fade=smooth(clamp(u/.06))*smooth(clamp((1-u)/.12));
    const start=wave===0?[.42*W,1.18*H]:[1.12*W,.95*H],end=wave===0?[.7*W,.6*H]:[.78*W,.55*H];
    const x=end[0]+(start[0]-end[0])*persp,y=end[1]+(start[1]-end[1])*persp;
    const ang=Math.atan2(end[1]-start[1],end[0]-start[0]);
    const base=(wave===0?.42:.26)*Math.min(W,H*1.6)*(.04+.96*persp);
    FLEET.forEach((s,i)=>{
      if(wave===1&&i>2)return;
      const L=base*s.s,ox=s.ox*base,oy=s.oy*base;
      const ca=Math.cos(ang),sa=Math.sin(ang),px=x+ox*ca-oy*sa,py=y+ox*sa+oy*ca;
      g.save();g.globalAlpha=fade*(.5+.5*persp);g.translate(px,py);g.rotate(ang);
      // engine trail
      const tg=g.createLinearGradient(-.52*L,0,-2.4*L,0);tg.addColorStop(0,'rgba(150,215,255,.55)');tg.addColorStop(1,'rgba(150,215,255,0)');
      g.fillStyle=tg;g.fillRect(-2.4*L,-.025*L,1.9*L,.05*L);
      drawShip(g,s.type,L,.55+.45*persp);
      g.globalCompositeOperation='lighter';
      const er=Math.max(3,L*.12);
      [-.03,.03].forEach(o=>{g.drawImage(ENG,-.53*L-er,o*L-er,er*2,er*2);g.drawImage(WHT,-.53*L-er*.3,o*L-er*.3,er*.6,er*.6);});
      g.restore();
    });
  }
}

/* ---------------- loop ---------------- */
let ok=false,t0=performance.now(),ema=16,last=0,fc=0,odd=false;
function frame(now){
  if(!ok)ok=size();
  const t=(now-t0)/1000,dt=now-(last||now);last=now;ema=ema*.94+Math.min(dt,120)*.06;
  if(++fc%60===0&&ema>30&&scale>.38&&!document.hidden){scale*=.82;size();}   // keep it smooth on slower GPUs
  const sc=clamp(scrollY/innerHeight);
  odd=!odd;
  if(ok&&(sc<1||odd)){
    if(prog){
      const C=camera(t,sc);
      gl.viewport(0,0,cv.width,cv.height);
      gl.uniform2f(U.uRes,cv.width,cv.height);gl.uniform1f(U.uTime,t);
      gl.uniform3fv(U.uCam,C.cam);gl.uniform3fv(U.uRight,C.right);gl.uniform3fv(U.uUp,C.up);gl.uniform3fv(U.uFwd,C.fwd);gl.uniform3fv(U.uSun,C.sun);
      gl.uniform2f(U.uSunUV,C.su[0],C.su[1]);gl.uniform1f(U.uFlare,C.vis);gl.uniform1f(U.uFov,FOV);gl.uniformMatrix3fv(U.uRot,false,rotMat(t));
      gl.drawArrays(gl.TRIANGLES,0,3);
    }
    drawFleet(t);
    $('.hero-in').style.opacity=1-clamp(sc*1.6);
  }
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{ok=size();});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
